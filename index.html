<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Online - Penalaran Umum</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

    <div class="main-container">

        <div id="login-container" class="page active">
            <div class="card login-card">
                <div class="card-header">
                    <i class="bi bi-shield-lock-fill"></i>
                    <h2>Selamat Datang</h2>
                    <p>Silakan login untuk memulai ujian.</p>
                </div>
                <form id="login-form">
                    <div class="input-group">
                        <label for="username"><i class="bi bi-person"></i> Nama Lengkap</label>
                        <input type="text" id="username" placeholder="Masukkan nama Anda" required>
                    </div>
                    <div class="input-group">
                        <label for="password"><i class="bi bi-key"></i> Password</label>
                        <input type="password" id="password" placeholder="Masukkan password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Mulai Ujian</button>
                    <p id="login-error" class="error-message"></p>
                </form>
            </div>
        </div>

        <div id="exam-container" class="page">
            <header class="exam-header">
                <div class="header-info">
                    <h1>Pengetahuan & Pemahaman Umum</h1>
                    <span class="user-greeting" id="user-greeting">Peserta: ...</span>
                </div>
                <div class="timer-box">
                    <i class="bi bi-clock-history"></i>
                    <span>Sisa Waktu</span>
                    <strong id="timer">90:00</strong>
                </div>
            </header>
            <main class="exam-body">
                <div class="question-panel card">
                    <div class="question-header">
                        <span id="question-number">Soal Nomor 1 dari 30</span>
                        <button id="doubtful-btn" class="btn btn-doubtful"><i class="bi bi-flag"></i> Ragu-ragu</button>
                    </div>
                    <div class="question-content">
                        <div class="question-context" id="question-context"></div>
                        <p id="question-text"></p>
                        <div id="options-container"></div>
                    </div>
                    <div class="question-footer">
                        <button id="prev-btn" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Sebelumnya</button>
                        <button id="next-btn" class="btn btn-primary">Selanjutnya <i class="bi bi-arrow-right"></i></button>
                    </div>
                </div>
                <aside class="navigation-panel card">
                    <h4>Navigasi Soal</h4>
                    <div id="question-nav"></div>
                    <button id="submit-btn" class="btn btn-danger"><i class="bi bi-check2-circle"></i> Selesaikan Ujian</button>
                </aside>
            </main>
        </div>

        <div id="result-container" class="page">
            <div class="card result-card">
                 <div class="result-icon success">
                    <i class="bi bi-trophy-fill"></i>
                </div>
                <h2 id="result-greeting"></h2>
                <p>Anda telah berhasil menyelesaikan ujian.</p>
                <div class="score-display">
                    <span>Skor Akhir Anda</span>
                    <h1 id="score">0</h1>
                </div>
                <div class="result-actions">
                    <button id="review-btn" class="btn btn-primary"><i class="bi bi-journal-text"></i> Lihat Pembahasan</button>
                    <button id="restart-btn" class="btn btn-secondary"><i class="bi bi-arrow-clockwise"></i> Ulangi</button>
                </div>
            </div>
        </div>
        
        <div id="review-container" class="page">
            <header class="exam-header">
                <h1>Pembahasan Soal</h1>
                <button id="back-to-home-btn" class="btn btn-secondary"><i class="bi bi-house-door"></i> Kembali</button>
            </header>
            <div id="review-content"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
